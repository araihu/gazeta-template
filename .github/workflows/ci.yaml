name: Blog CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Build, validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate structured data, build and package
        run: make check dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: blog-${{ github.sha }}
          path: public/
          if-no-files-found: error
